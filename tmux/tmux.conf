# ── Prefix ───────────────────────────────────────────────────────────────────
set -g prefix "'"
unbind C-b
unbind C-Space
bind "'" send-prefix
set -g @prefix_mode "apostrophe"
set -g @prefix_label "'"
bind T run-shell "~/.config/tmux/scripts/tmux-toggle-prefix"
bind t run-shell "~/.config/tmux/scripts/tmux-toggle-theme"

# ── AI CLI for new sessions ──────────────────────────────────────────────────
# Used by ~/.config/tmux/scripts/px when creating new sessions.
set -g @ai_cli "claude"
bind C run-shell "tmux set-option -g @ai_cli claude \\; display-message 'New sessions will open claude'"
bind O run-shell "tmux set-option -g @ai_cli codex \\; display-message 'New sessions will open codex'"
bind A run-shell 'current="$(tmux show-option -gv @ai_cli)"; if [ "$current" = "codex" ]; then tmux set-option -g @ai_cli claude \; display-message "New sessions will open claude"; else tmux set-option -g @ai_cli codex \; display-message "New sessions will open codex"; fi'

# ── Terminal / Colors ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0        # no delay on Esc (important for nvim)
set -g extended-keys on     # pass through extended key sequences (shift+enter, etc.)
set -g history-limit 50000
set -g focus-events on      # lets nvim autoread work
set -g allow-passthrough on # pass OSC 8 hyperlinks through to Ghostty
bind-key -n MouseDown1Pane if-shell -F "#{mouse_hyperlink}" \
  "run-shell 'open \"#{mouse_hyperlink}\"'" \
  "send-keys -M"
# Log raw pane output so OSC 8 URIs can be extracted (capture-pane strips them)
set-hook -g after-new-session  'pipe-pane -o "cat >> /tmp/tmux-pane-#{pane_id}"'
set-hook -g after-new-window   'pipe-pane -o "cat >> /tmp/tmux-pane-#{pane_id}"'
set-hook -g after-split-window 'pipe-pane -o "cat >> /tmp/tmux-pane-#{pane_id}"'
set-hook -g pane-died          'run-shell "rm -f /tmp/tmux-pane-#{pane_id}"'
run-shell "tmux list-panes -a -F '##{pane_id}' | while read p; do tmux pipe-pane -t \"$p\" -o \"cat >> /tmp/tmux-pane-$p\"; done"
bind-key u \
  run-shell "echo '#{pane_id}' > /tmp/tmux-url-pane" \;\
  display-popup -E "/Users/mgiampaolo/.config/tmux/scripts/tmux-open-url"

# ── Vi mode ───────────────────────────────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Window / Session navigation ───────────────────────────────────────────────
bind Tab last-window        # toggle between last two windows (nvim <-> claude)
bind Space display-popup -E "~/.config/tmux/scripts/tmux-session-picker"
bind s display-popup -E "~/.config/tmux/scripts/tmux-session-picker"
bind w display-popup -E "~/.config/tmux/scripts/tmux-worktree-picker"
bind l next-layout
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind y copy-mode            # enter copy/visual mode

bind M run-shell "tmux capture-pane -p -S -32768 > /tmp/tmux-cap-#{pane_id}.txt && tmux split-window -h 'nvim +$ -c \"set nu rnu\" /tmp/tmux-cap-#{pane_id}.txt'"

# ── Pane resizing ─────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Pane navigation — aware of nvim splits (vim-tmux-navigator) ───────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?\$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'egel/tmux-gruvbox'
# Catppuccin theme (used when in light theme)
#set -g @plugin 'catppuccin/tmux'
#set -g @catppuccin_flavor 'latte'

# Gruvbox options
set -g @tmux-gruvbox 'dark256' # 'dark' or 'dark256', 'light', 'light256'
#set -g @tmux-gruvbox-statusbar-alpha 'true'
set -g @tmux-gruvbox-right-status-z '#{@prefix_label} 🇦🇷'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-style 'bg=#1d2021,fg=#ebdbb2'
set -g status-left '#[bg=#3c3836,fg=#fabd2f,bold] #S #[bg=#1d2021,fg=#3c3836]'
set -g status-right '#[bg=#1d2021,fg=#665c54]#[bg=#665c54,fg=#ebdbb2] #{@prefix_label} 🇦🇷 #[bg=#fabd2f,fg=#665c54]#[bg=#fabd2f,fg=#1d2021,bold] %H:%M '
set -g window-status-separator ''
set -g window-status-format '#[bg=#1d2021,fg=#928374] #I  #W '
set -g window-status-current-format '#[bg=#fabd2f,fg=#1d2021,bold] #I  #W #[bg=#1d2021,fg=#fabd2f]'
